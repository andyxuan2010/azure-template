<text x="985" y="225" class="heading" text-anchor="middle">Azure DevOps Pipeline</text>
<text x="985" y="259" class="small" text-anchor="middle">Explicitly authorized pipeline</text>
<rect x="814" y="280" width="342" height="213" rx="20" fill="#cce7fc"/>
<rect x="940" y="302" width="90" height="24" rx="5" fill="#22577e" stroke="#102f4e" stroke-width="3"/><circle cx="952" cy="314" r="4" fill="#78db90"/>
<rect x="940" y="330" width="90" height="24" rx="5" fill="#22577e" stroke="#102f4e" stroke-width="3"/><circle cx="952" cy="342" r="4" fill="#78db90"/>
<rect x="940" y="358" width="90" height="24" rx="5" fill="#22577e" stroke="#102f4e" stroke-width="3"/><circle cx="952" cy="370" r="4" fill="#78db90"/>
<text x="985" y="419" class="heading" text-anchor="middle">Self-Hosted Agent</text>
<text x="985" y="452" class="body" text-anchor="middle">Validate / plan / deploy</text>
