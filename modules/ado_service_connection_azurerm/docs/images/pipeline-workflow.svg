<circle cx="788" cy="706" r="18" fill="#0078d4"/>
<text x="788" y="714" text-anchor="middle" style="fill:white;font-size:25px;font-weight:700">2</text>
<text x="826" y="708" class="body" text-anchor="start">Push triggers an</text>
<text x="826" y="736" class="body" text-anchor="start">authorized pipeline on</text>
<text x="826" y="764" class="body" text-anchor="start">a self-hosted agent.</text>
<path d="M1210 691V770" stroke="#c4cdd8" stroke-width="2"/>
<circle cx="1249" cy="706" r="18" fill="#0078d4"/>
<text x="1249" y="714" text-anchor="middle" style="fill:white;font-size:25px;font-weight:700">3</text>
<text x="1287" y="708" class="body" text-anchor="start">Service connection uses</text>
<text x="1287" y="736" class="body" text-anchor="start">federation to obtain a</text>
<text x="1287" y="764" class="body" text-anchor="start">short-lived Azure token.</text>
<path d="M1671 691V770" stroke="#c4cdd8" stroke-width="2"/>
<circle cx="1710" cy="706" r="18" fill="#0078d4"/>
