<text x="130" y="410" class="heading" text-anchor="middle">Developer</text>
<text x="130" y="443" class="small" text-anchor="middle">Home laptop</text>
<rect x="380" y="180" width="270" height="340" rx="20" fill="url(#card)" stroke="#667085" stroke-width="2.5"/>
<text x="515" y="225" class="heading" text-anchor="middle">Azure DevOps</text>
<text x="515" y="256" class="heading" text-anchor="middle">(ADO)</text>
<rect x="473" y="292" width="84" height="84" rx="9" transform="rotate(45 515 334)" fill="#f45132"/><path d="M495 305L534 344M509 320V357" stroke="white" stroke-width="5" fill="none"/><g fill="white"><circle cx="495" cy="305" r="7"/><circle cx="534" cy="344" r="7"/><circle cx="509" cy="357" r="7"/></g>
<text x="515" y="444" class="heading" text-anchor="middle">Source Code Repo</text>
<text x="515" y="478" class="small" text-anchor="middle">Git / infrastructure code</text>
