<circle cx="1710" cy="260" r="18" fill="#0078d4"/>
<text x="1710" y="268" text-anchor="middle" style="fill:white;font-size:25px;font-weight:700">4</text>
<text x="1710" y="304" class="label" text-anchor="middle">Deploy via</text>
<text x="1710" y="331" class="label" text-anchor="middle">Azure APIs</text>
<image href="data:image/svg+xml;base64," x="1750" y="555" width="46" height="46"/>
<text x="1966" y="570" class="small" text-anchor="middle">Terraform state access:</text>
<text x="1966" y="601" class="small" text-anchor="middle">Storage RBAC + network / DNS</text>
<text x="1086" y="633" class="small" text-anchor="middle">The module provisions the service connection, federated trust and explicit pipeline grants; workload infrastructure remains caller-owned.</text>
