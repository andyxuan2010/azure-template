<text x="720" y="268" text-anchor="middle" style="fill:white;font-size:25px;font-weight:700">2</text>
<text x="720" y="304" class="label" text-anchor="middle">Trigger</text>
<text x="720" y="331" class="label" text-anchor="middle">pipeline</text>
<path d="M1180 350H1315" class="link"/>
<circle cx="1250" cy="260" r="18" fill="#0078d4"/>
<text x="1250" y="268" text-anchor="middle" style="fill:white;font-size:25px;font-weight:700">3</text>
<text x="1250" y="304" class="label" text-anchor="middle">Federated</text>
<text x="1250" y="331" class="label" text-anchor="middle">sign-in</text>
