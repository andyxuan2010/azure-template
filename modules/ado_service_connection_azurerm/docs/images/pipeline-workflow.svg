<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="800" viewBox="0 0 2172 800" role="img" aria-labelledby="title desc">
<title id="title">CI/CD Pipeline Workflow – Deploy Azure Resources</title>
<desc id="desc">A developer pushes infrastructure code to Azure DevOps Git, triggering an authorized pipeline on a self-hosted agent. An Azure Resource Manager service connection uses workload identity federation with an existing user-assigned managed identity to obtain a short-lived Azure token. The pipeline deploys resources within caller-owned Azure RBAC scope. Terraform state requires separate storage permissions and connectivity.</desc>
<defs>
<linearGradient id="banner" x2="1" y2="1"><stop stop-color="#104d85"/><stop offset="1" stop-color="#0b3e71"/></linearGradient>
<linearGradient id="card" x2="0" y2="1"><stop stop-color="#f6f9fc"/><stop offset="1" stop-color="#e8eff7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#101828} .bold{font-weight:700}.muted{fill:#344054}.link{fill:none;stroke:#111827;stroke-width:4;marker-end:url(#arrow)}.label{font-size:23px;font-weight:600}.body{font-size:24px}.small{font-size:22px}.heading{font-size:28px;font-weight:700}</style>
</defs>
<rect width="2172" height="800" fill="white"/>
