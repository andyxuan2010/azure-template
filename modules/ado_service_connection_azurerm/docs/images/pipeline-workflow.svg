<image href="data:image/svg+xml;base64," x="1443" y="187" width="74" height="74"/>
<text x="1480" y="287" class="heading" text-anchor="middle">Azure Resource</text>
<text x="1480" y="319" class="heading" text-anchor="middle">Manager</text>
<text x="1480" y="351" class="heading" text-anchor="middle">Service Connection</text>
<text x="1480" y="400" class="small" text-anchor="middle">Workload identity federation</text>
<text x="1480" y="435" class="small" text-anchor="middle">Existing managed identity</text>
<text x="1480" y="470" class="small" text-anchor="middle">Short-lived Azure token</text>
<text x="1480" y="508" class="small" text-anchor="middle">No client secret</text>
