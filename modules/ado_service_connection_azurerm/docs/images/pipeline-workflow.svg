<text x="1966" y="382" class="body" text-anchor="middle">Resource group / resources</text>
<text x="1966" y="416" class="body" text-anchor="middle">Caller-owned scoped RBAC</text>
<text x="1966" y="478" class="heading" text-anchor="middle">Deploy and verify</text>
