<path d="M36 675H276V785H36Q16 785 16 765V695Q16 675 36 675Z" fill="url(#banner)"/>
<text x="146" y="740" text-anchor="middle" style="fill:white;font-size:29px;font-weight:700">Steps Summary</text>
<circle cx="327" cy="706" r="18" fill="#0078d4"/>
<text x="327" y="714" text-anchor="middle" style="fill:white;font-size:25px;font-weight:700">1</text>
<text x="365" y="708" class="body" text-anchor="start">Developer pushes</text>
<text x="365" y="736" class="body" text-anchor="start">infrastructure code</text>
<text x="365" y="764" class="body" text-anchor="start">to the ADO Git repo.</text>
