name: Terraform

on:
  push:
    branches:
      - main
      - dev
      - sbx
  pull_request:
    branches:
      - main
      - dev
      - sbx
  workflow_dispatch:
    inputs:
      apply:
        description: Run terraform apply after plan
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-required-secrets:
    name: Check Required Secrets
    runs-on: ubuntu-latest
    outputs:
      has_azure_credentials: ${{ steps.secrets.outputs.has_azure_credentials }}
    steps:
      - name: Evaluate required Azure secrets
        id: secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${AZURE_CLIENT_ID}" && -n "${AZURE_CLIENT_SECRET}" && -n "${AZURE_TENANT_ID}" && -n "${AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "has_azure_credentials=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_azure_credentials=false" >> "${GITHUB_OUTPUT}"
            echo "Azure validation secrets are missing. Validation jobs will be skipped."
          fi

  validate-plan:
    name: Validate and Plan
    needs: check-required-secrets
    if: (github.repository != 'andyxuan2010/azure-template' || github.actor != 'github-actions[bot]') && needs.check-required-secrets.outputs.has_azure_credentials == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'sbx' && 'sbx' || 'dev' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve branch context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          case "${branch_name}" in
            main)
              deploy_env="prod"
              ;;
            dev)
              deploy_env="dev"
              ;;
            sbx)
              deploy_env="sbx"
              ;;
            *)
              deploy_env="dev"
              ;;
          esac

          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"
          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init without backend
        if: vars.TF_BACKEND_READY != 'true'
        run: terraform init -input=false -no-color -backend=false

      - name: Terraform Init with backend
        if: vars.TF_BACKEND_READY == 'true'
        run: terraform init -input=false -no-color -reconfigure

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform root harness test
        if: vars.TF_BACKEND_READY == 'true'
        run: terraform test -filter=tests/root-plan.tftest.hcl -no-color

      - name: Terraform plan
        if: vars.TF_BACKEND_READY == 'true'
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_VAR_environment: ${{ steps.context.outputs.deploy_env }}

      - name: Upload plan artifact
        if: github.event_name != 'pull_request' && vars.TF_BACKEND_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: tfplan
          if-no-files-found: error

  detect-module-targets:
    name: Detect Module Harness Targets
    if: github.repository != 'andyxuan2010/azure-template' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      has_modules: ${{ steps.detect.outputs.has_modules }}
      module_matrix: ${{ steps.detect.outputs.module_matrix }}
      module_list: ${{ steps.detect.outputs.module_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed module harness targets
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${PR_BASE_SHA}"
            head_ref="${PR_HEAD_SHA}"
          else
            base_ref="${PUSH_BEFORE_SHA}"
            head_ref="${PUSH_HEAD_SHA}"
          fi

          module_matrix="$(bash scripts/module-harness-targets.sh detect --base "${base_ref}" --head "${head_ref}" --format github-matrix)"
          module_list_json="$(bash scripts/module-harness-targets.sh detect --base "${base_ref}" --head "${head_ref}" --format json-array)"

          if [[ "${module_list_json}" == "[]" ]]; then
            has_modules="false"
          else
            has_modules="true"
          fi

          echo "has_modules=${has_modules}" >> "${GITHUB_OUTPUT}"
          echo "module_matrix=${module_matrix}" >> "${GITHUB_OUTPUT}"
          echo "module_list=${module_list_json}" >> "${GITHUB_OUTPUT}"

          echo "Selected module harness targets: ${module_list_json}"

  validate-modules:
    name: Validate Module Harness (${{ matrix.module }})
    if: (github.repository != 'andyxuan2010/azure-template' || github.actor != 'github-actions[bot]') && needs.check-required-secrets.outputs.has_azure_credentials == 'true' && vars.TF_BACKEND_READY == 'true' && needs.detect-module-targets.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    needs:
      - check-required-secrets
      - validate-plan
      - detect-module-targets
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.detect-module-targets.outputs.module_matrix) }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build module harness overrides
        shell: bash
        env:
          TARGET_MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/module-plan.tfvars.json"
          bash scripts/module-harness-targets.sh overrides --module "$TARGET_MODULE" --output "$output_file"
          echo "MODULE_TFVARS_FILE=$output_file" >> "$GITHUB_ENV"

      - name: Terraform Init without backend
        if: vars.TF_BACKEND_READY != 'true'
        run: terraform init -input=false -no-color -backend=false

      - name: Terraform Init with backend
        if: vars.TF_BACKEND_READY == 'true'
        run: terraform init -input=false -no-color -reconfigure

      - name: Terraform plan selected module harness
        if: vars.TF_BACKEND_READY == 'true'
        run: terraform plan -input=false -no-color -lock=false -var-file="$MODULE_TFVARS_FILE"

  apply:
    name: Apply
    if: false
    needs:
      - check-required-secrets
      - validate-plan
      - validate-modules
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'sbx' && 'sbx' || 'dev' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve branch context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${GITHUB_REF_NAME}"

          case "${branch_name}" in
            main)
              deploy_env="prod"
              ;;
            dev)
              deploy_env="dev"
              ;;
            sbx)
              deploy_env="sbx"
              ;;
            *)
              deploy_env="dev"
              ;;
          esac

          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -no-color -reconfigure

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color
        env:
          TF_VAR_environment: ${{ steps.context.outputs.deploy_env }}

  create-git-tag:
    name: Create Git Tag
    if: always() && github.event_name != 'pull_request' && github.repository != 'andyxuan2010/azure-template' && needs.validate-plan.result == 'success' && (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    needs:
      - validate-plan
      - validate-modules
    outputs:
      release_tag: ${{ steps.semver.outputs.release_tag }}
      release_notes: ${{ steps.semver.outputs.release_notes }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push semantic version tag
        id: semver
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          latest_tag="$(git tag --list 'v[1-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            latest_tag="v1.0.0"
            previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -n "${previous_tag}" ]]; then
              commit_range="${previous_tag}..${SOURCE_SHA}"
            else
              commit_range="${SOURCE_SHA}"
            fi
          else
            commit_range="${latest_tag}..${SOURCE_SHA}"
          fi

          commits="$(git log --format=%B ${commit_range})"
          release_notes="$(git log --format='- %s (%h)' ${commit_range} | head -n 20)"
          if [[ -z "${release_notes}" ]]; then
            release_notes="- ${SOURCE_SHA}"
          fi

          {
            echo "release_notes<<EOF"
            printf '%s\n' "${release_notes}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          bump=""

          if grep -Eq '(^|[[:space:]])BREAKING[ -]CHANGE:|^[a-zA-Z][a-zA-Z0-9-]*(\([^)]+\))?!:' <<< "${commits}"; then
            bump="major"
          elif grep -Eq '^feat(\([^)]+\))?:' <<< "${commits}"; then
            bump="minor"
          elif grep -Eq '^fix(\([^)]+\))?:' <<< "${commits}"; then
            bump="patch"
          else
            echo "No semantic-release prefix found; defaulting to patch bump."
            bump="patch"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "${version}"

          case "${bump}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          tag_name="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} already exists."
            echo "release_tag=${tag_name}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_message="$(mktemp)"
          {
            echo "Release ${tag_name} (${bump})"
            echo
            echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
            echo "Range: ${commit_range}"
            echo
            echo "Changes:"
            printf '%s\n' "${release_notes}"
          } > "${tag_message}"

          git tag -a "${tag_name}" "${SOURCE_SHA}" -F "${tag_message}"
          git push origin "refs/tags/${tag_name}"
          echo "release_tag=${tag_name}" >> "${GITHUB_OUTPUT}"

  publish-stage-repo:
    name: Publish Stage Repo
    if: always() && github.event_name != 'pull_request' && github.repository != 'andyxuan2010/azure-template' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    needs:
      - check-required-secrets
      - validate-plan
      - create-git-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish clean snapshot to stage repo
        env:
          STAGE_REPO_URL: https://github.com/andyxuan2010/azure-template
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${STAGE_REPO_TOKEN}" ]]; then
            echo "Missing required secret: STAGE_REPO_TOKEN" >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          rsync -a \
            --exclude='.git' \
            "${GITHUB_WORKSPACE}/" "${workdir}/repo/"

          cd "${workdir}/repo"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${SOURCE_BRANCH}"
          git add .
          git commit -m "Stage snapshot from ${SOURCE_BRANCH}@${SOURCE_SHA}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            release_notes="${RELEASE_NOTES:-}"
            if [[ -z "${release_notes}" ]]; then
              release_notes="- ${SOURCE_SHA}"
            fi

            tag_message="$(mktemp)"
            {
              echo "Release ${RELEASE_TAG} snapshot"
              echo
              echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
              echo
              echo "Changes:"
              printf '%s\n' "${release_notes}"
            } > "${tag_message}"

            git tag -a "${RELEASE_TAG}" -F "${tag_message}"
          fi

          target_repo="${STAGE_REPO_URL#https://}"
          git remote add origin "https://x-access-token:${STAGE_REPO_TOKEN}@${target_repo}.git"
          git push --force origin "${SOURCE_BRANCH}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Stage repo already has tag ${RELEASE_TAG}; leaving it unchanged."
            else
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

  publish-ado-repo:
    name: Publish ADO Repo
    if: always() && github.event_name != 'pull_request' && github.repository != 'andyxuan2010/azure-template' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    needs:
      - check-required-secrets
      - validate-plan
      - create-git-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Git history to Azure DevOps repo
        env:
          ADO_REPO_URL: https://dev.azure.com/CCOE-Azure/IaC/_git/template
          ADO_REPO_PAT: ${{ secrets.ADO_REPO_PAT }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ADO_REPO_PAT}" ]]; then
            echo "Missing required secret: ADO_REPO_PAT" >&2
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"

          git fetch --force --tags origin

          target_repo="${ADO_REPO_URL#https://}"
          git remote remove ado 2>/dev/null || true
          git remote add ado "https://ado:${ADO_REPO_PAT}@${target_repo}"

          git checkout "${SOURCE_BRANCH}"
          git push --force ado "refs/heads/${SOURCE_BRANCH}:refs/heads/${SOURCE_BRANCH}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            if git ls-remote --exit-code --tags ado "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "ADO repo already has tag ${RELEASE_TAG}; leaving it unchanged."
            else
              git push ado "refs/tags/${RELEASE_TAG}"
            fi
          fi
